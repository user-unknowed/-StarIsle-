name: Deploy Promo Page

on:
  push:
    branches:
      - main
    paths:
      - 'docs/promo/**'
      - 'web-frontend/**'
      - '.github/workflows/deploy-promo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间仅允许一个部署任务运行
concurrency:
  group: promo-pages
  cancel-in-progress: true

env:
  PROMO_TITLE_MUST_CONTAIN: "你的情绪星球"   # 用于后续日志自检

jobs:
  deploy:
    name: Deploy Promo + Web App to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-frontend/package-lock.json'

      - name: Install web-frontend dependencies
        working-directory: ./web-frontend
        run: npm ci

      - name: Build web-frontend
        working-directory: ./web-frontend
        run: npm run build

      - name: Assemble Pages artifact (promo@root + app@/app)
        run: |
          # 🟢 使用一个完全干净的 staging 目录，避免任何污染
          rm -rf ./pages-staging
          mkdir -p ./pages-staging

          # 1) 拷贝宣传页到 staging 根（promo 位于 /）
          cp -rT ./docs/promo ./pages-staging

          # 2) 拷贝 Web 应用到 staging/app（Web 位于 /app/）
          mkdir -p ./pages-staging/app
          cp -rT ./web-frontend/dist ./pages-staging/app

          # 3) 🔍 打印目录结构，让 Actions 日志可追溯
          echo "=== pages-staging/ 最终结构 (前 3 层) ==="
          find ./pages-staging -maxdepth 3 | sort
          echo "=== pages-staging/index.html 标题检查 ==="
          grep -oE '<title>[^<]*</title>' ./pages-staging/index.html || true
          echo "=== pages-staging/app/index.html 标题检查 ==="
          grep -oE '<title>[^<]*</title>' ./pages-staging/app/index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-staging

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
