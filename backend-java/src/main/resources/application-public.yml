# 公网暴露专用配置：仅在 --spring.profiles.active=public 时生效
# 要求所有敏感参数通过环境变量注入，缺失关键项时启动失败（fail-closed）
server:
  # 默认对外 HTTPS 端口
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${TLS_ENABLED:true}
    # PKCS12 证书库路径，例如 file:/etc/starisle/tls/starisle.p12
    key-store: ${TLS_KEYSTORE:}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: ${TLS_KEY_ALIAS:starisle}
    # 仅允许 TLS 1.2 / 1.3
    enabled-protocols: TLSv1.2,TLSv1.3
  # 位于反向代理之后，按 X-Forwarded-* 解析协议与客户端 IP
  forward-headers-strategy: framework

spring:
  h2:
    console:
      enabled: false

starisle:
  jwt:
    # 公网环境必须显式提供强随机密钥，不提供默认值
    secret: ${JWT_SECRET}
  ai-service:
    # ai-engine 只允许内网/本机地址
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    token: ${AI_INTERNAL_TOKEN}
  # 不配置则所有管理端点拒绝访问
  admin-token: ${ADMIN_API_TOKEN:}
  # 公网网关永久关闭管理端点（迁移/密钥操作请在受控内网执行）
  admin-enabled: false
  rate-limit:
    enabled: true
    rps: ${RATE_LIMIT_RPS:20}
    burst: ${RATE_LIMIT_BURST:40}
    # 公网经由反向代理，信任代理写入的 X-Forwarded-For
    trust-proxy: true
  # 必须显式配置可信前端来源，例如 https://app.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.starisle: INFO
