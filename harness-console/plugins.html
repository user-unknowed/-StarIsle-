<main class="app-content">
  <div class="content-inner">

<div class="page-head">
  <div class="head-row">
    <div>
      <h1>插件运行时</h1>
      <div class="sub">Cordis 内核动态装配 · 273 个 dsh-* 插件 · 启停为标记位，重启后生效（全部为本地 mock）</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="searchbar" style="max-width:250px">
        <span data-icon="search" data-size="14"></span>
        <input id="plugSearch" class="input" type="text" placeholder="搜索包名或职责…">
      </div>
      <select id="groupFilter" class="select" style="width:150px">
        <option value="">全部分组</option>
      </select>
      <select id="statusFilter" class="select" style="width:118px">
        <option value="">全部状态</option>
        <option value="on">启用</option>
        <option value="off">停用</option>
      </select>
    </div>
  </div>
</div>

<div class="stat-grid" style="margin-bottom:16px">
  <div class="stat">
    <div class="k"><span data-icon="puzzle" data-size="13"></span>dsh-* 插件</div>
    <div class="v" id="statPlugins">-</div>
    <div class="d">由 Cordis <span id="statCordis"></span> 动态装配</div>
  </div>
  <div class="stat">
    <div class="k"><span data-icon="folder" data-size="13"></span>子系统分组</div>
    <div class="v" id="statGroups">-</div>
    <div class="d">覆盖 LLM / Agent / 工具 / 沙箱 / 会话等</div>
  </div>
  <div class="stat">
    <div class="k"><span data-icon="database" data-size="13"></span>共享包</div>
    <div class="v" id="statPkgs">-</div>
    <div class="d">~/.dsh 运行时共享依赖</div>
  </div>
</div>

<div id="groups"></div>

<div id="coreModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3><span data-icon="alert-triangle" data-size="18"></span>停用核心插件</h3>
    <p id="coreModalText"></p>
    <ul id="coreModalEffects"></ul>
    <div class="modal-actions">
      <button id="coreModalCancel" class="btn btn-ghost" type="button">取消</button>
      <button id="coreModalOk" class="btn btn-danger" type="button">确认停用</button>
    </div>
  </div>
</div>

<div id="plugOverlay" class="drawer-overlay" style="display:none"></div>
<aside id="plugDrawer" class="drawer" style="display:none" aria-label="插件详情">
  <div class="drawer-head">
    <h3 id="plugDrawerTitle" class="mono" style="word-break:break-all;font-size:14px"></h3>
    <button id="plugDrawerClose" class="icon-btn" type="button" aria-label="关闭"><span data-icon="x" data-size="15"></span></button>
  </div>
  <div class="drawer-body">
    <dl class="kv" id="plugDrawerKv"></dl>
  </div>

<script>
// 页面脚本 · 插件运行时
(function () {
  "use strict";
  var DB = window.DB, HCA = window.HCA;
  var state = { q: "", group: "", status: "" };
  var groupsEl = document.getElementById("groups");

  /* 图标占位填充（静态部分） */
  function fillIcons(root) {
    var els = (root || document).querySelectorAll("[data-icon]");
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      el.innerHTML = HCA.svgIcon(el.getAttribute("data-icon"), parseInt(el.getAttribute("data-size") || "16", 10));
    }
  }
  fillIcons(document);

  /* 头部统计取自 DB.runtime */
  document.getElementById("statPlugins").textContent = DB.runtime.pluginsTotal;
  document.getElementById("statGroups").textContent = DB.runtime.pluginGroups;
  document.getElementById("statPkgs").textContent = DB.runtime.sharedPkgs;
  document.getElementById("statCordis").textContent = DB.runtime.cordis;

  /* 分组下拉选项 */
  var groupFilter = document.getElementById("groupFilter");
  DB.pluginGroups.forEach(function (g) {
    var o = document.createElement("option");
    o.value = g.id;
    o.textContent = g.name;
    groupFilter.appendChild(o);
  });

  function findPlugin(pkg) {
    for (var i = 0; i < DB.pluginGroups.length; i++) {
      var g = DB.pluginGroups[i];
      for (var j = 0; j < g.plugins.length; j++) {
        if (g.plugins[j].pkg === pkg) return { pl: g.plugins[j], g: g };
      }
    }
    return null;
  }

  /* 核心插件停用影响 · 按组通用文案 */
  var CORE_IMPACT = {
    llm: "LLM 接入不可用，所有补全与联网搜索请求都无法发起",
    agent: "Agent 循环停摆，会话编排与子代理派生失效",
    tools: "对应工具从工具集移除，相关任务无法执行",
    sandbox: "沙箱策略解析失效，写操作裁决将回退为拒绝",
    session: "会话事件流无法持久化，历史记录与恢复能力受影响",
    account: "账户态与凭据服务不可用，鉴权类请求失败",
    web: "Web 抓取与搜索接入中断，引用类能力降级",
    desktop: "宿主运行器停摆，窗口 / IPC / 自动更新能力失效",
    experimental: "对应实验特性在重启后不可用",
    sdk: "协议层中断，外部客户端无法接入运行时"
  };

  /* 渲染分组列表（叠加 搜索 + 分组 + 状态 三重过滤） */
  function renderGroups() {
    var q = state.q.trim().toLowerCase();
    var html = "";
    DB.pluginGroups.forEach(function (g) {
      if (state.group && g.id !== state.group) return;
      var list = g.plugins.filter(function (pl) {
        if (state.status === "on" && pl.enabled === false) return false;
        if (state.status === "off" && pl.enabled !== false) return false;
        if (q && pl.pkg.toLowerCase().indexOf(q) < 0 && (pl.role || "").toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      if (!list.length) return;
      html += '<div class="card" style="margin-bottom:14px">'
        + '<div class="card-head"><div><h3>' + HCA.esc(g.name) + '</h3><div class="hint">' + HCA.esc(g.desc) + '</div></div>'
        + '<span class="tag tag-muted">' + HCA.esc(g.count) + ' 个 · 展示 ' + list.length + ' 个</span></div>';
      list.forEach(function (pl) {
        var enabled = pl.enabled !== false;
        html += '<div class="list-row" data-pkg="' + HCA.esc(pl.pkg) + '">'
          + '<div style="flex:1;min-width:0">'
          + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
          + '<span class="mono" style="font-weight:700;font-size:13px">' + HCA.esc(pl.pkg) + '</span>'
          + (pl.core ? '<span class="tag tag-info">核心</span>' : '')
          + '</div>'
          + '<div style="font-size:12px;color:var(--text-sub);margin-top:3px">' + HCA.esc(pl.role || "") + '</div>'
          + '</div>'
          + '<span class="mono" style="font-size:12px;color:var(--text-sub);flex:none">' + HCA.esc(pl.ver) + '</span>'
          + '<span style="font-size:11.5px;color:var(--text-faint);flex:none">deps ' + HCA.esc(pl.deps) + '</span>'
          + '<label class="switch"><input type="checkbox" data-pkg="' + HCA.esc(pl.pkg) + '"' + (enabled ? " checked" : "") + ' aria-label="启停 ' + HCA.esc(pl.pkg) + '"><span class="track"></span></label>'
          + '</div>';
      });
      html += '</div>';
    });
    if (!html) {
      html = '<div class="empty"><span data-icon="search" data-size="34" style="display:inline-block"></span>'
        + '<div class="t">没有匹配的插件</div><div>调整搜索词或筛选条件后重试</div></div>';
    }
    groupsEl.innerHTML = html;
    fillIcons(groupsEl);
    /* 开关点击 stopPropagation：不触发行点击（详情抽屉） */
    var sws = groupsEl.querySelectorAll(".switch");
    for (var i = 0; i < sws.length; i++) {
      sws[i].addEventListener("click", function (e) { e.stopPropagation(); });
    }
  }

  /* 行点击 → 详情抽屉（switch 区域已在上方被 stopPropagation 拦截，此处再兜底） */
  groupsEl.addEventListener("click", function (ev) {
    if (ev.target.closest(".switch")) return;
    var row = ev.target.closest(".list-row");
    if (row) openDrawer(row.getAttribute("data-pkg"));
  });

  /* 开关 change → 启停标记位 */
  groupsEl.addEventListener("change", function (ev) {
    var inp = ev.target;
    if (!inp.matches || !inp.matches('input[type="checkbox"]')) return;
    var found = findPlugin(inp.getAttribute("data-pkg"));
    if (!found) return;
    var enabled = inp.checked;
    if (!enabled && found.pl.core) {
      inp.checked = true; /* 视觉回滚，等待确认弹窗 */
      openCoreModal(found);
      return;
    }
    HCA.api.setPluginEnabled(found.pl.pkg, enabled);
    HCA.toast(enabled ? "已启用 · 重启后生效" : "已标记停用 · 重启运行时后生效", enabled ? "ok" : "warn");
    renderGroups();
  });

  /* ---------- 核心插件停用确认弹窗 ---------- */
  var coreModal = document.getElementById("coreModal");
  var pendingCore = null;

  function openCoreModal(found) {
    pendingCore = found;
    document.getElementById("coreModalText").textContent =
      found.pl.pkg + " 是运行时核心依赖，停用后相关能力在重启后不可用";
    var ul = document.getElementById("coreModalEffects");
    ul.innerHTML = "";
    var li1 = document.createElement("li");
    li1.textContent = CORE_IMPACT[found.g.id] || "该子系统在重启后不可用";
    var li2 = document.createElement("li");
    li2.textContent = "Cordis 装配图在重启时重算，依赖此插件的其他插件将无法加载";
    ul.appendChild(li1);
    ul.appendChild(li2);
    coreModal.style.display = "";
  }
  function closeCoreModal() {
    coreModal.style.display = "none";
    pendingCore = null;
  }
  document.getElementById("coreModalCancel").addEventListener("click", closeCoreModal);
  document.getElementById("coreModalOk").addEventListener("click", function () {
    if (!pendingCore) return;
    HCA.api.setPluginEnabled(pendingCore.pl.pkg, false);
    closeCoreModal();
    renderGroups();
    HCA.toast("已标记停用 · 重启运行时后生效", "warn");
  });

  /* ---------- 详情抽屉 ---------- */
  var plugOverlay = document.getElementById("plugOverlay");
  var plugDrawer = document.getElementById("plugDrawer");
  var drawerKv = document.getElementById("plugDrawerKv");
  var drawerTitle = document.getElementById("plugDrawerTitle");

  function kvRow(dtText, ddContent) {
    var dt = document.createElement("dt");
    dt.textContent = dtText;
    var dd = document.createElement("dd");
    if (typeof ddContent === "string") dd.textContent = ddContent;
    else dd.appendChild(ddContent);
    drawerKv.appendChild(dt);
    drawerKv.appendChild(dd);
  }

  function openDrawer(pkg) {
    var found = findPlugin(pkg);
    if (!found) return;
    var pl = found.pl, g = found.g;
    var enabled = pl.enabled !== false;
    drawerTitle.textContent = pl.pkg;
    drawerKv.innerHTML = "";
    kvRow("包名", pl.pkg);
    kvRow("版本", pl.ver);
    kvRow("分组", g.name);
    kvRow("职责", pl.role || "—");
    kvRow("依赖数", String(pl.deps));
    var tag = document.createElement("span");
    tag.className = "tag " + (enabled ? "tag-ok" : "tag-warn");
    tag.textContent = enabled ? "启用" : "停用";
    kvRow("状态", tag);
    kvRow("启停说明", "标记位，重启 Cordis 运行时后生效");
    plugOverlay.style.display = "";
    plugDrawer.style.display = "";
  }
  function closeDrawer() {
    plugOverlay.style.display = "none";
    plugDrawer.style.display = "none";
  }
  plugOverlay.addEventListener("click", closeDrawer);
  document.getElementById("plugDrawerClose").addEventListener("click", closeDrawer);

  /* ---------- 筛选事件 ---------- */
  document.getElementById("plugSearch").addEventListener("input", function (e) {
    state.q = e.target.value;
    renderGroups();
  });
  groupFilter.addEventListener("change", function (e) {
    state.group = e.target.value;
    renderGroups();
  });
  document.getElementById("statusFilter").addEventListener("change", function (e) {
    state.status = e.target.value;
    renderGroups();
  });

  renderGroups();
})();
</script>
</body>
</html>
