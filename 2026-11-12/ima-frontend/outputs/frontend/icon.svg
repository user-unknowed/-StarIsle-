<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ima 复刻版">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19c67a"/>
      <stop offset="1" stop-color="#079d55"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底色：整幅铺满，适配 maskable 裁切 -->
  <rect width="512" height="512" fill="#079d55"/>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="220" rx="112" fill="url(#gloss)"/>

  <!-- 字标：安全区内居中 -->
  <text x="256" y="322" text-anchor="middle"
        font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="196" font-weight="700" letter-spacing="-8" fill="#ffffff">ima</text>

  <!-- 品牌点缀：右下角对话点 -->
  <circle cx="386" cy="376" r="26" fill="#ffffff" fill-opacity=".9"/>
</svg>
