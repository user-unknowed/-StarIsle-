                role:
                  type: string
                  enum: [student, teacher]
                  description: 角色
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      username:
                        type: string
                      nickname:
                        type: string
                      role:
                        type: string
                      token:
                        type: string

  /api/v1/users/login:
    post:
