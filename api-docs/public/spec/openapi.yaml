                  maxLength: 50
                password:
                  type: string
                  description: 密码
                  minLength: 6
                  maxLength: 20
                nickname:
                  type: string
                  description: 昵称
                  maxLength: 50
                avatar:
                  type: string
                  description: 头像URL
                  maxLength: 200
                ageGroup:
                  type: string
