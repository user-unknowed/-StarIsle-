  # ==================== 数据迁移 ====================
  /api/migration/execute:
    post:
      tags: [数据迁移]
      summary: 执行数据迁移
      description: 从当前数据存储系统迁移到MySQL数据库
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 迁移成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      migrationId:
                        type: string
                      startTime:
                        type: string
                        format: date-time
                      endTime:
                        type: string
                        format: date-time
                      status:
                        type: string
                        enum: [success, failed]
                      affectedRows:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            table:
                              type: string
                            identifier:
                              type: string
                            message:
                              type: string

  /api/migration/verify:
    get:
      tags: [数据迁移]
      summary: 验证数据一致性
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 验证结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      allConsistent:
                        type: boolean
                      tableChecks:
                        type: array
                        items:
                          type: object
                          properties:
                            tableName:
                              type: string
                            sourceCount:
                              type: integer
                            targetCount:
                              type: integer
                            consistent:
                              type: boolean

  /api/migration/checksum/{tableName}:
    get:
      tags: [数据迁移]
      summary: 计算表校验和
      security:
        - bearerAuth: []
      parameters:
        - name: tableName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 计算成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      tableName:
                        type: string
                      checksum:
                        type: string

  # ==================== 密钥管理 ====================
  /api/migration/keys:
    get:
      tags: [密钥管理]
      summary: 获取所有密钥列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EncryptionKey'

  /api/migration/keys/current:
    get:
      tags: [密钥管理]
      summary: 获取当前密钥版本
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: string
                    description: 当前密钥版本号

  /api/migration/keys/{version}:
    get:
      tags: [密钥管理]
      summary: 获取密钥信息
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: string
    delete:
      tags: [密钥管理]
      summary: 停用密钥版本
      security:
        - bearerAuth: []
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 停用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/migration/keys/rotate:
    post:
      tags: [密钥管理]
      summary: 轮换密钥
      description: 创建新密钥版本并停用旧版本
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 轮换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/migration/keys/add:
    post:
      tags: [密钥管理]
      summary: 新增密钥版本
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/migration/encrypt/test:
    post:
      tags: [密钥管理]
      summary: 加密功能测试
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: 待加密内容
      responses:
        '200':
          description: 测试成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      original:
                        type: string
                      encrypted:
                        type: string
                      decrypted:
                        type: string
                      consistent:
                        type: boolean

  # ==================== 系统 ====================
  /health:
    get:
      tags: [系统]
      summary: 健康检查
      description: 返回服务健康状态、服务名与版本号
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: starisle-api
                  version:
                    type: string
                    example: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token认证

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: object
          nullable: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: 认证失败
        data:
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        role:
          type: string
          enum: [student, teacher, parent]
        ageGroup:
          type: string
        signature:
          type: string
        classId:
          type: string
        schoolName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MoodRecord:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        moodLevel:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
        note:
          type: string
        checkinDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        content:
          type: string
        role:
          type: string
          enum: [user, assistant]
        riskLevel:
          type: string
          enum: [green, yellow, orange, red]
        timestamp:
          type: string
          format: date-time

    StudentInfo:
      type: object
      properties:
        id:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        ageGroup:
          type: string
        latestMood:
          type: integer
        riskLevel:
          type: string
          enum: [green, yellow, orange, red]
        alert:
          type: boolean

    ParentLoginResponse:
      type: object
      properties:
        userId:
          type: string
        nickname:
          type: string
        avatar:
          type: string
        phone:
          type: string
        token:
          type: string
          description: JWT令牌（仅登录/注册时返回）

    ChildBindingResponse:
