<main class="app-content">
  <div class="content-inner">

<div class="page-head">
  <h1>会话控制台</h1>
  <div class="sub">树状会话 · 请求级能力开关 · PoW 前置 · 沙箱联动（全部为本地 mock）</div>
</div>

<div class="chat-grid">
  <div class="session-col">
    <div class="col-head">
      <b>会话</b>
      <button class="btn btn-sm btn-ghost" id="newSessionBtn"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>新建</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <div class="chat-main">
    <div class="chat-top">
      <span class="title" id="chatTitle"></span>
      <a class="tag tag-ok" href="sandbox.html" id="sandboxTag"></a>
      <span class="tag tag-info" id="modelTag"></span>
      <span style="flex:1"></span>
      <button class="btn btn-sm btn-ghost" id="demoTimeout"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>演示空闲超时</button>
    </div>

    <div id="branchBar" style="display:none;padding:8px 18px;border-bottom:1px solid var(--border);align-items:center;gap:10px;flex-wrap:wrap"></div>

    <div class="chat-stream" id="chatStream"></div>

    <div class="composer-wrap">
      <div class="param-bar">
        <div class="param-item">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
          <select id="modelSel" class="select" style="width:auto;padding:4px 26px 4px 9px;font-size:12px"></select>
        </div>
        <div class="param-item">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg>
          <label for="thinkSw">思考</label>
          <label class="switch"><input type="checkbox" id="thinkSw"><span class="track"></span></label>
        </div>
        <div class="param-item">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <label for="searchSw">联网</label>
          <label class="switch"><input type="checkbox" id="searchSw"><span class="track"></span></label>
        </div>
        <div class="param-item">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <div class="seg" id="effortSeg"></div>
        </div>
        <div class="param-item">
          <span>详略</span>
          <div class="seg" id="verbSeg"></div>
        </div>
        <div class="param-item mono" id="maxOutNote" style="font-size:11px;color:var(--text-faint)"></div>
      </div>
      <div class="composer">
        <textarea id="promptBox" rows="1" placeholder="向运行时发送指令…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="btn btn-primary" id="sendBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>发送</button>
      </div>
      <div class="pow-strip" id="powStrip">
        <div class="progress" style="flex:1"><i id="powBar" style="width:0%"></i></div>
        <span id="powStep"></span>
      </div>
    </div>
  </div>
</div>

</div>
</main>
<script src="mock.js"></script>
<script src="components.js"></script>
<script src="api.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  "use strict";
  var DB = window.DB;
  var HCA = window.HCA;

  /* ---------- 状态 ---------- */
  var state = { model: "deepseek-flash", thinking: false, search: false, effort: "high", verbosity: "high" };
  var curSessionId = "s1";
  var streaming = false;
  var streamToken = 0;
  var liveHost = null, liveBubble = null, liveText = "";

  var SUGGESTIONS = [
    "梳理 session-persistence 的写入路径",
    "更新 docs/locks.md 里的锁描述",
    "联网查一下 flock 与命名信号量的对比",
    "解释 PoW 链路的三步"
  ];

  /* ---------- 基础工具 ---------- */
  function $id(id) { return document.getElementById(id); }
  function esc(s) { return HCA.esc(s); }
  function modelById(mt) {
    for (var i = 0; i < DB.models.length; i++) { if (DB.models[i].model_type === mt) return DB.models[i]; }
    return null;
  }
  function curSession() {
    for (var i = 0; i < DB.sessions.length; i++) { if (DB.sessions[i].id === curSessionId) return DB.sessions[i]; }
    return DB.sessions[0];
  }
  function sandboxTone(mode) {
    if (mode === "workspace-write") return "tag-warn";
    if (mode === "danger-full-access") return "tag-danger";
    return "tag-ok";
  }
  function shortId(id) { return id.length > 5 ? id.slice(-4) : id; }
  function scrollBottom() {
    var st = $id("chatStream");
    st.scrollTop = st.scrollHeight;
  }

  /* ---------- 消息树 ---------- */
  function bucket(msgs) {
    var map = {};
    msgs.forEach(function (m) {
      var k = m.parentId || "root";
      if (!map[k]) map[k] = [];
      map[k].push(m);
    });
    return map;
  }
  function activePath(msgs, session) {
    var byParent = bucket(msgs);
    var path = [];
    var forkId = "root";
    while (true) {
      var kids = byParent[forkId] || [];
      if (!kids.length) break;
      var chosen = session.activeBranches[forkId];
      var next = null;
      for (var i = 0; i < kids.length; i++) { if (kids[i].id === chosen) { next = kids[i]; break; } }
      if (!next) next = kids[0];
      path.push(next);
      forkId = next.id;
    }
    return path;
  }
  function nearestUserText(msgs, forkId) {
    var byId = {};
    msgs.forEach(function (m) { byId[m.id] = m; });
    var cur = forkId ? byId[forkId] : null;
    while (cur) {
      if (cur.role === "user") {
        var bs = cur.blocks || [];
        for (var i = 0; i < bs.length; i++) { if (bs[i].type === "text") return bs[i].text; }
        return "";
      }
      cur = cur.parentId ? byId[cur.parentId] : null;
    }
    return "";
  }

  /* ---------- 参数条 ---------- */
  function renderModelSel() {
    var html = "";
    DB.models.forEach(function (m) {
      html += '<option value="' + esc(m.model_type) + '"' + (m.enabled ? "" : " disabled") + ">"
        + esc(m.name + (m.enabled ? "" : "（已下线）")) + "</option>";
    });
    var sel = $id("modelSel");
    sel.innerHTML = html;
    sel.value = state.model;
  }
  function renderEffortSeg() {
    var m = modelById(state.model);
    var arr = (m && m.effort && m.effort.length) ? m.effort : ["off", "low", "high", "max"];
    if (arr.indexOf(state.effort) < 0) state.effort = (m && m.defaultEffort) ? m.defaultEffort : arr[arr.length - 1];
    $id("effortSeg").innerHTML = arr.map(function (v) {
      return '<button data-effort="' + v + '"' + (v === state.effort ? ' class="on"' : "") + ">" + v + "</button>";
    }).join("");
  }
  function renderVerbSeg() {
    $id("verbSeg").innerHTML = ["high", "low"].map(function (v) {
      return '<button data-verb="' + v + '"' + (v === state.verbosity ? ' class="on"' : "") + ">" + v + "</button>";
    }).join("");
  }
  function renderMaxNote() {
    var m = modelById(state.model);
    $id("maxOutNote").textContent = "max output " + (m ? m.maxOutput : 0).toLocaleString("en-US") + " tokens";
  }

  /* ---------- 会话列表 ---------- */
  function renderSessions() {
    var list = $id("sessionList");
    if (!DB.sessions.length) {
      list.innerHTML = '<div class="empty">' + HCA.svgIcon("message-square", 34)
        + '<div class="t">暂无会话</div><div>点击上方「新建」开始。</div></div>';
      return;
    }
    var html = "";
    DB.sessions.forEach(function (s) {
      html += '<div class="list-row' + (s.id === curSessionId ? " on" : "") + '" data-sid="' + esc(s.id) + '">'
        + '<div style="flex:1;min-width:0">'
        + '<div class="s-title" style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(s.title) + "</div>"
        + '<div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:var(--text-faint);white-space:nowrap;overflow:hidden">'
        + '<span style="flex:none">' + s.msgs + " 条消息</span>"
        + '<span class="tag ' + sandboxTone(s.sandboxMode) + '">' + esc(s.sandboxMode) + "</span>"
        + '<span class="mono" style="flex:none">' + esc(s.updatedAt) + "</span>"
        + "</div></div>"
        + '<button class="icon-btn" data-rename="' + esc(s.id) + '" title="重命名" style="opacity:0;transition:opacity .15s;flex:none">' + HCA.svgIcon("pencil", 14) + "</button>"
        + "</div>";
    });
    list.innerHTML = html;
  }

  /* ---------- 聊天区渲染 ---------- */
  function renderChatTop(s) {
    $id("chatTitle").textContent = s.title;
    var tag = $id("sandboxTag");
    tag.className = "tag " + sandboxTone(s.sandboxMode);
    tag.textContent = s.sandboxMode;
    var m = modelById(state.model);
    $id("modelTag").textContent = m ? m.name : state.model;
  }
  function renderBranchBar(s, msgs) {
    var byParent = bucket(msgs);
    var path = activePath(msgs, s);
    var html = "";
    path.forEach(function (m) {
      var kids = byParent[m.id] || [];
      if (kids.length < 2) return;
      var active = s.activeBranches[m.id];
      var ok = false;
      kids.forEach(function (k) { if (k.id === active) ok = true; });
      if (!ok) active = kids[0].id;
      html += '<div class="seg">' + kids.map(function (k) {
        var label = k.branchLabel ? esc(k.branchLabel) : "分支 " + shortId(k.id);
        return '<button data-fork="' + esc(m.id) + '" data-child="' + esc(k.id) + '"' + (k.id === active ? ' class="on"' : "") + ">" + label + "</button>";
      }).join("") + "</div>";
    });
    var bar = $id("branchBar");
    if (html) { bar.innerHTML = html; bar.style.display = "flex"; }
    else { bar.innerHTML = ""; bar.style.display = "none"; }
  }
  function thinkingHTML(sec, text, open) {
    var chev = HCA.svgIcon("chevron-right", 13).replace("<svg ", '<svg class="chev" ');
    return '<div class="thinking-block' + (open ? " open" : "") + '">'
      + '<div class="thinking-head">' + HCA.svgIcon("brain", 13)
      + "<span>思考过程 · " + Number(sec || 0).toFixed(1) + "s</span>" + chev + "</div>"
      + '<div class="thinking-body">' + esc(text || "") + "</div>"
      + "</div>";
  }
  function toolHTML(b) {
    var icon = b.tool === "fs.write" ? "file" : (b.tool === "bash" ? "terminal" : "globe");
    var status = b.status === "executed" ? '<span class="tag tag-ok">已执行</span>'
      : (b.status === "awaiting_approval" ? '<span class="tag tag-warn">待审批</span>'
        : '<span class="tag tag-danger">已拒绝</span>');
    var html = '<div class="tool-block">'
      + '<div class="tool-head">' + HCA.svgIcon(icon, 14)
      + '<span class="tool-name">' + esc(b.tool) + "</span>"
      + '<span class="tool-target" style="flex:1;min-width:0">' + esc(b.target || "") + "</span>"
      + status + "</div>"
      + '<div class="tool-body">';
    if (b.tool === "web_search") {
      (b.results || []).forEach(function (r) {
        html += '<div class="cite-card">'
          + '<div class="cite-title">' + esc(r.title || "") + "</div>"
          + '<div class="cite-url">' + esc(r.url || "") + "</div>"
          + '<div class="cite-meta"><span>' + esc(r.pageAge || "") + "</span><span>引用摘要</span></div>"
          + '<div class="cite-quote">' + esc(r.quote || "") + "</div>"
          + "</div>";
      });
    } else {
      if (b.summary) html += '<div style="font-size:12px;color:var(--text-sub);margin-bottom:6px">' + esc(b.summary) + "</div>";
      html += '<div class="tool-out">' + esc(b.out || "") + "</div>";
    }
    html += "</div></div>";
    if (b.status === "awaiting_approval") {
      html += '<div class="blocker">' + HCA.svgIcon("alert-triangle", 15)
        + "<span>写入请求待审批</span>"
        + '<a href="sandbox.html">前往沙箱与审批处理</a></div>';
    }
    return html;
  }
  function msgHTML(m) {
    var isUser = m.role === "user";
    var html = '<div class="msg' + (isUser ? " msg-user" : "") + '" data-id="' + esc(m.id) + '">'
      + '<div class="avatar ' + (isUser ? "avatar-user" : "avatar-ai") + '">' + (isUser ? "你" : "AI") + "</div>"
      + '<div class="msg-body">'
      + '<div class="msg-meta"><b>' + (isUser ? "你" : "assistant") + "</b>";
    if (!isUser && m.showModelName && m.model) html += '<span class="mono" style="font-size:11px">' + esc(m.model) + "</span>";
    html += '<span class="mono">' + esc(m.ts || "") + "</span></div>";
    (m.blocks || []).forEach(function (b) {
      if (b.type === "thinking") html += thinkingHTML(b.sec, b.text, false);
      else if (b.type === "tool") html += toolHTML(b);
      else if (b.type === "text") html += '<div class="bubble">' + esc(b.text) + "</div>";
    });
    if (!isUser) {
      html += '<div class="msg-actions"><button class="btn btn-sm btn-ghost" data-regen="' + esc(m.id) + '">'
        + HCA.svgIcon("rotate-cw", 13) + "重新生成</button></div>";
    }
    html += "</div></div>";
    return html;
  }
  function emptyStateHTML() {
    return '<div class="empty">' + HCA.svgIcon("git-branch", 34)
      + '<div class="t">开始新的会话</div>'
      + "<div>在下方输入指令，运行时会先完成 PoW 前置，再按当前参数流式回复；写操作将按会话沙箱模式裁决。</div></div>"
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 18px 20px">'
      + SUGGESTIONS.map(function (t) {
        return '<button class="btn btn-sm btn-ghost" data-suggest="' + esc(t) + '">' + esc(t) + "</button>";
      }).join("")
      + "</div>";
  }
  function renderChat() {
    var s = curSession();
    var msgs = DB.messages[s.id] || [];
    renderChatTop(s);
    renderBranchBar(s, msgs);
    var stream = $id("chatStream");
    stream.innerHTML = msgs.length
      ? activePath(msgs, s).map(msgHTML).join("")
      : emptyStateHTML();
    scrollBottom();
  }
  function renderAll() { renderSessions(); renderChat(); }

  /* ---------- 发送 / 流式 ---------- */
  async function runPowUI() {
    var strip = $id("powStrip"), bar = $id("powBar"), step = $id("powStep");
    strip.classList.add("on");
    bar.style.width = "0%";
    step.textContent = "准备 PoW 挑战…";
    try {
      await HCA.api.runPow(function (text, pct) {
        bar.style.width = pct + "%";
        step.textContent = text;
      });
    } finally {
      strip.classList.remove("on");
      bar.style.width = "0%";
      step.textContent = "";
    }
  }
  async function doStream(s, am, prompt, token) {
    if (token !== streamToken) return;
    var plan = HCA.api.planCompletion({
      prompt: prompt,
      model: state.model,
      thinking: state.thinking,
      search: state.search,
      verbosity: state.verbosity,
      sandboxMode: s.sandboxMode
    });
    if (plan.approvalNeeded) {
      HCA.api.addApproval({
        tool: plan.approvalNeeded.tool,
        target: plan.approvalNeeded.target,
        summary: plan.approvalNeeded.summary
      });
      HCA.refreshNavCount();
    }
    renderChat();
    var msgEl = $id("chatStream").querySelector('.msg[data-id="' + am.id + '"]');
    if (!msgEl) return;
    var host = msgEl.querySelector(".msg-body");
    var anchor = msgEl.querySelector(".msg-actions");
    if (anchor) anchor.style.display = "none";
    liveHost = host;
    liveBubble = null;
    liveText = "";
    var thinkBody = null;

    await HCA.api.streamCompletion(plan, {
      onThinking: function (sec, text) {
        if (token !== streamToken) return;
        if (!thinkBody) {
          anchor.insertAdjacentHTML("beforebegin", thinkingHTML(sec, "", true));
          thinkBody = host.querySelector(".thinking-body");
          am.blocks.push({ type: "thinking", sec: sec, text: "" });
        }
        thinkBody.textContent = text;
        am.blocks[0].text = text;
        am.blocks[0].sec = sec;
        scrollBottom();
      },
      onTool: function (block) {
        if (token !== streamToken) return;
        var b = {};
        for (var k in block) { if (Object.prototype.hasOwnProperty.call(block, k)) b[k] = block[k]; }
        var bubbleEl = host.querySelector(".bubble");
        (bubbleEl || anchor).insertAdjacentHTML("beforebegin", toolHTML(b));
        am.blocks.push(b);
        scrollBottom();
      },
      onToken: function (chunk) {
        if (token !== streamToken) return;
        liveText += chunk;
        if (!liveBubble) {
          anchor.insertAdjacentHTML("beforebegin", '<div class="bubble"></div>');
          liveBubble = host.querySelector(".bubble");
        }
        liveBubble.innerHTML = esc(liveText) + '<span class="stream-caret"></span>';
        var last = am.blocks[am.blocks.length - 1];
        if (last && last.type === "text") last.text = liveText;
        else am.blocks.push({ type: "text", text: liveText });
        scrollBottom();
      },
      onDone: function (p) {
        if (token !== streamToken) return;
        if (liveBubble) liveBubble.textContent = p.text;
        if (p.text) {
          var last = am.blocks[am.blocks.length - 1];
          if (last && last.type === "text") last.text = p.text;
          else am.blocks.push({ type: "text", text: p.text });
        }
        if (anchor) anchor.style.display = "";
        liveHost = null; liveBubble = null; liveText = "";
        scrollBottom();
      }
    });
  }
  function finishStream() {
    streaming = false;
    $id("sendBtn").disabled = false;
    renderSessions();
  }
  async function sendMessage() {
    if (streaming) { HCA.toast("当前有回复正在生成，请稍候", "warn"); return; }
    var box = $id("promptBox");
    var prompt = box.value.trim();
    if (!prompt) return;
    var s = curSession();
    streaming = true;
    $id("sendBtn").disabled = true;
    var myToken = ++streamToken;
    try {
      await runPowUI();
      if (myToken !== streamToken) return;
      var path = activePath(DB.messages[s.id] || [], s);
      var tail = path.length ? path[path.length - 1].id : null;
      var um = HCA.api.appendMessage(s.id, {
        id: "u" + Date.now(), parentId: tail, role: "user", ts: "刚刚",
        blocks: [{ type: "text", text: prompt }]
      });
      box.value = "";
      var am = HCA.api.appendMessage(s.id, {
        id: "a" + Date.now(), parentId: um.id, role: "assistant", ts: "刚刚",
        model: state.model, showModelName: true, blocks: []
      });
      await doStream(s, am, prompt, myToken);
    } finally {
      if (myToken === streamToken) finishStream();
    }
  }
  async function regenMessage(msgId) {
    if (streaming) { HCA.toast("当前有回复正在生成，请稍候", "warn"); return; }
    var s = curSession();
    var msgs = DB.messages[s.id] || [];
    var target = null;
    msgs.forEach(function (m) { if (m.id === msgId) target = m; });
    if (!target || target.role !== "assistant") return;
    var forkId = target.parentId || null;
    var prompt = nearestUserText(msgs, forkId);
    var am = HCA.api.appendMessage(s.id, {
      id: "a" + Date.now(), parentId: forkId, role: "assistant", ts: "刚刚",
      model: state.model, showModelName: true, blocks: []
    });
    s.activeBranches[forkId || "root"] = am.id;
    streaming = true;
    $id("sendBtn").disabled = true;
    var myToken = ++streamToken;
    try {
      await runPowUI();
      if (myToken !== streamToken) return;
      await doStream(s, am, prompt, myToken);
    } finally {
      if (myToken === streamToken) finishStream();
    }
  }
  function demoTimeout() {
    if (!streaming) { HCA.toast("当前没有进行中的流式回复", "warn"); return; }
    streamToken++;
    var host = liveHost, bubble = liveBubble;
    if (bubble) bubble.innerHTML = esc(liveText);
    if (host) {
      var acts = host.querySelector(".msg-actions");
      var blocker = '<div class="blocker">' + HCA.svgIcon("clock", 15)
        + "<span>流式空闲超时（300,000 ms）— 已保留已生成内容</span>"
        + '<span style="color:var(--text-faint)">重新生成可继续</span></div>';
      if (acts) acts.insertAdjacentHTML("beforebegin", blocker);
      else host.insertAdjacentHTML("beforeend", blocker);
      if (acts) acts.style.display = "";
    }
    liveHost = null; liveBubble = null; liveText = "";
    finishStream();
    HCA.toast("已触发流式空闲超时（300,000 ms），已保留已生成内容", "warn");
  }
  function cancelStream() {
    if (!streaming) return;
    streamToken++;
    if (liveBubble) liveBubble.innerHTML = esc(liveText);
    if (liveHost) {
      var acts = liveHost.querySelector(".msg-actions");
      if (acts) acts.style.display = "";
    }
    liveHost = null; liveBubble = null; liveText = "";
    finishStream();
  }

  /* ---------- 会话操作 ---------- */
  function selectSession(sid) {
    if (sid === curSessionId) return;
    if (streaming) cancelStream();
    curSessionId = sid;
    renderAll();
  }
  function startRename(sid, row) {
    var s = null;
    DB.sessions.forEach(function (x) { if (x.id === sid) s = x; });
    if (!s || !row || row.querySelector("input")) return;
    var titleEl = row.querySelector(".s-title");
    if (!titleEl) return;
    var input = document.createElement("input");
    input.className = "input";
    input.value = s.title;
    input.style.padding = "3px 8px";
    input.style.fontSize = "12.5px";
    titleEl.style.display = "none";
    titleEl.parentNode.insertBefore(input, titleEl);
    var finished = false;
    var done = function (save) {
      if (finished) return;
      finished = true;
      if (save) {
        var v = input.value.trim();
        if (v && v !== s.title) HCA.api.renameSession(sid, v);
      }
      renderSessions();
      if (sid === curSessionId) $id("chatTitle").textContent = curSession().title;
    };
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); done(true); }
    });
    input.addEventListener("blur", function () { done(true); });
    input.focus();
    input.select();
  }

  /* ---------- 事件绑定 ---------- */
  function bindEvents() {
    $id("newSessionBtn").addEventListener("click", function () {
      if (streaming) cancelStream();
      var s = HCA.api.createSession();
      curSessionId = s.id;
      renderAll();
    });
    var list = $id("sessionList");
    list.addEventListener("click", function (e) {
      var rn = e.target.closest("[data-rename]");
      if (rn) { startRename(rn.getAttribute("data-rename"), rn.closest(".list-row")); return; }
      var row = e.target.closest(".list-row[data-sid]");
      if (row) selectSession(row.getAttribute("data-sid"));
    });
    list.addEventListener("mouseover", function (e) {
      var row = e.target.closest(".list-row");
      if (!row) return;
      var btn = row.querySelector("[data-rename]");
      if (btn) btn.style.opacity = "1";
    });
    list.addEventListener("mouseout", function (e) {
      var row = e.target.closest(".list-row");
      if (!row) return;
      var btn = row.querySelector("[data-rename]");
      if (btn) btn.style.opacity = "0";
    });
    $id("chatStream").addEventListener("click", function (e) {
      var th = e.target.closest(".thinking-head");
      if (th) {
        var blk = th.closest(".thinking-block");
        if (blk) blk.classList.toggle("open");
        return;
      }
      var rg = e.target.closest("[data-regen]");
      if (rg) { regenMessage(rg.getAttribute("data-regen")); return; }
      var sg = e.target.closest("[data-suggest]");
      if (sg) {
        var box = $id("promptBox");
        box.value = sg.getAttribute("data-suggest");
        box.focus();
      }
    });
    $id("branchBar").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-fork]");
      if (!b) return;
      if (streaming) { HCA.toast("流式回复进行中，暂不能切换分支", "warn"); return; }
      var s = curSession();
      s.activeBranches[b.getAttribute("data-fork")] = b.getAttribute("data-child");
      renderChat();
    });
    $id("demoTimeout").addEventListener("click", demoTimeout);
    $id("modelSel").addEventListener("change", function () {
      state.model = this.value;
      renderEffortSeg();
      renderMaxNote();
      renderChatTop(curSession());
    });
    $id("thinkSw").addEventListener("change", function () { state.thinking = this.checked; });
    $id("searchSw").addEventListener("change", function () { state.search = this.checked; });
    $id("effortSeg").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-effort]");
      if (!b) return;
      state.effort = b.getAttribute("data-effort");
      renderEffortSeg();
    });
    $id("verbSeg").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-verb]");
      if (!b) return;
      state.verbosity = b.getAttribute("data-verb");
      renderVerbSeg();
    });
    $id("promptBox").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $id("sendBtn").addEventListener("click", sendMessage);
  }

  /* ---------- 初始化 ---------- */
  renderModelSel();
  renderEffortSeg();
  renderVerbSeg();
  renderMaxNote();
  renderAll();
  bindEvents();
})();
</script>
</body>
</html>
