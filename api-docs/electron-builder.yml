appId: com.starisle.apidocs
productName: 星屿API文档
copyright: Copyright © 2026 StarIsle

directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - dist/**/*
  - package.json

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Development

win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64

asar: true
asarUnpack:
  - node_modules/**/*
