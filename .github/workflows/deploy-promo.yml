name: Deploy Promo Page

on:
  push:
    branches:
      - main
    paths:
      - 'docs/promo/**'
      - 'web-frontend/**'
      - '.github/workflows/deploy-promo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间仅允许一个部署任务运行
concurrency:
  group: promo-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Promo + Web App to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web-frontend/package-lock.json'

      - name: Install web-frontend dependencies
        working-directory: ./web-frontend
        run: npm ci

      - name: Build web-frontend
        working-directory: ./web-frontend
        run: npm run build

      - name: Merge web-frontend into promo/app
        run: |
          mkdir -p ./docs/promo/app
          cp -r ./web-frontend/dist/* ./docs/promo/app/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/promo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
