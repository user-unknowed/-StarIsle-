version: '3.8'

services:
  # MySQL数据库 (生产环境)
  mysql:
    image: mysql:8.0
    container_name: starisle-mysql
    environment:
      MYSQL_DATABASE: starisle
      MYSQL_USER: starisle_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "starisle_user", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB数据库
  mongodb:
    image: mongo:6.0
    container_name: starisle-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: starisle_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7.0-alpine
    container_name: starisle-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java后端服务
  backend-java:
    build:
      context: ../backend-java
      dockerfile: Dockerfile
    container_name: starisle-backend-java
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: jdbc:mysql://mysql:3306/starisle?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: starisle_user
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      MONGODB_URL: mongodb://starisle_admin:${MONGO_PASSWORD}@mongodb:27017/starisle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      AI_SERVICE_URL: http://ai-engine:8000
      SHOW_SQL: false

  # AI对话引擎
  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: dockerfile
    container_name: starisle-ai
    depends_on:
      - redis
      - mongodb
    ports:
      - "8000:8000"
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_API_BASE: ${MODEL_API_BASE}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://starisle_admin:${MONGO_PASSWORD}@mongodb:27017/starisle

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
