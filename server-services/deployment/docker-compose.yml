version: '3.8'

services:
  # PostgreSQL数据库 (生产环境，统一数据库选型)
  postgres:
    image: postgres:14-alpine
    container_name: starisle-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starisle}
      POSTGRES_USER: ${POSTGRES_USER:-starisle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    # 数据库仅供内部网络访问，不映射到宿主机
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starisle_user} -d ${POSTGRES_DB:-starisle}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB数据库
  mongodb:
    image: mongo:6.0
    container_name: starisle-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: starisle_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    # 数据库仅供内部网络访问，不映射到宿主机
    expose:
      - "27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7.0-alpine
    container_name: starisle-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # 缓存仅供内部网络访问，不映射到宿主机
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java后端服务
  backend-java:
    build:
      context: ../../backend-java
      dockerfile: Dockerfile
    container_name: starisle-backend-java
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 网关只绑定宿主机回环地址，公网流量统一经 nginx 入口
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ENVIRONMENT: production
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-starisle}
      DATABASE_USERNAME: ${POSTGRES_USER:-starisle_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      MONGODB_URL: mongodb://starisle_admin:${MONGO_PASSWORD}@mongodb:27017/starisle
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      AI_SERVICE_URL: http://ai-engine:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      RATE_LIMIT_TRUST_PROXY: "true"
      SHOW_SQL: false
    restart: unless-stopped

  # AI对话引擎
  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: dockerfile
    container_name: starisle-ai
    depends_on:
      - redis
      - mongodb
    # ai-engine 仅供网关内部调用，不映射任何宿主机端口
    expose:
      - "8000"
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_API_BASE: ${MODEL_API_BASE}
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://starisle_admin:${MONGO_PASSWORD}@mongodb:27017/starisle
      INTERNAL_API_KEY: ${AI_INTERNAL_TOKEN}
      AI_BIND_HOST: 0.0.0.0
    restart: unless-stopped

  # 公网唯一入口：仅此服务映射 80/443，网关与 ai-engine 只在内部网络
  nginx:
    image: nginx:1.25-alpine
    container_name: starisle-nginx
    depends_on:
      - backend-java
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
