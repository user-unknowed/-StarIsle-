openapi: 3.0.3
info:
  title: 星屿心理健康管理系统 API
  version: 1.0.0
  description: |
    星屿心理健康管理系统是一款专为青少年心理健康设计的综合性管理平台。
    本文档包含所有API端点的详细说明，包括认证、学生端、教师端、家长端、数据迁移和密钥管理等功能。
    
    ## 认证方式
    所有需要认证的API端点都要求在请求头中携带JWT Token：
    ```
    Authorization: Bearer <your_jwt_token>
    ```
    
    ## 错误处理
    所有API统一返回以下格式：
    ```json
    {
      "code": 200,
      "message": "success",
      "data": {}
    }
    ```
    
    错误码说明：
    - 200: 成功
    - 400: 请求参数错误
    - 401: 未认证
    - 403: 无权限
    - 404: 资源不存在
    - 500: 服务器内部错误
    
servers:
  - url: http://localhost:8080
    description: 开发环境
  - url: https://api.starisle.com
    description: 生产环境

tags:
  - name: 认证管理
    description: 用户登录、注册、登出等认证接口
  - name: 学生端
    description: 学生端功能接口（心情打卡、AI对话、放松工具等）
  - name: 教师端
    description: 教师端功能接口（班级状态、学生管理等）
  - name: 家长端
    description: 家长端功能接口（绑定学生、查看心情等）
  - name: 用户管理
    description: 用户信息管理接口
  - name: 数据迁移
    description: 数据迁移和一致性校验接口
  - name: 密钥管理
    description: 加密密钥版本管理和轮换接口
  - name: 系统
    description: 系统健康检查等基础接口

paths:
  # ==================== 认证管理 ====================
  /api/v1/auth/login:
    post:
      tags: [认证管理]
      summary: 用户登录
      description: 支持学生、教师、家长三种角色的登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                  description: 用户名或手机号
                  example: student001
                password:
                  type: string
                  description: 密码
                  example: password123
                role:
                  type: string
                  enum: [student, teacher, parent]
                  description: 用户角色
                  example: student
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 登录成功
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT令牌
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                          username:
                            type: string
                          nickname:
                            type: string
                          role:
                            type: string
        '401':
          description: 登录失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      tags: [认证管理]
      summary: 用户注册
      description: 支持学生和教师角色注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, password, role]
              properties:
                nickname:
                  type: string
                  description: 昵称
                password:
                  type: string
                  description: 密码
                  minLength: 6
                role:
                  type: string
                  enum: [student, teacher]
                ageGroup:
                  type: string
                  enum: [初中生, 高中生]
                  description: 年龄组（仅学生角色）
                username:
                  type: string
                  description: 用户名（可选，默认自动生成）
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/auth/logout:
    post:
      tags: [认证管理]
      summary: 用户登出
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/auth/login/phone:
    post:
      tags: [认证管理]
      summary: 手机号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  description: 手机号
                  example: "13800138000"
                code:
                  type: string
                  description: 验证码
                  example: "123456"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/auth/sms/send:
    post:
      tags: [认证管理]
      summary: 发送短信验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: 手机号
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==================== 学生端 ====================
  /api/v1/mood/checkin:
    post:
      tags: [学生端]
      summary: 心情打卡
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, moodLevel]
              properties:
                userId:
                  type: string
                moodLevel:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: 心情等级 (1-5)
                  example: 4
                tags:
                  type: array
                  items:
                    type: string
                  description: 心情标签
                note:
                  type: string
                  description: 心情备注
      responses:
        '200':
          description: 打卡成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 打卡成功
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      checkinDate:
                        type: string
                        format: date
                      continuousDays:
                        type: integer

  /api/v1/mood/history/{userId}:
    get:
      tags: [学生端]
      summary: 获取心情历史
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
          description: 查询天数
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      history:
                        type: array
                        items:
                          $ref: '#/components/schemas/MoodRecord'
                      trend:
                        type: object

  /api/v1/mood/chart/{userId}:
    get:
      tags: [学生端]
      summary: 获取心情图表数据
      description: 返回最近7天的心情图表数据（柱状图）
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      chart_type:
                        type: string
                        example: bar
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            value:
                              type: integer

  /api/v1/chat/message:
    post:
      tags: [学生端]
      summary: 发送AI对话消息
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, message]
              properties:
                userId:
                  type: string
                message:
                  type: string
                  description: 用户消息内容
                  maxLength: 2000
                messageType:
                  type: string
                context:
                  type: array
                  items:
                    type: object
                  description: 上下文
                userProfile:
                  type: object
                  description: 用户画像
      responses:
        '200':
          description: 对话成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      response:
                        type: string
                        description: AI回复
                      response_time:
                        type: integer
                        description: 响应耗时(ms)
                      riskLevel:
                        type: string
                        enum: [green, yellow, orange, red]

  /api/v1/chat/history/{userId}:
    get:
      tags: [学生端]
      summary: 获取对话历史
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: 返回条数
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      limit:
                        type: integer
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatMessage'

  /api/v1/chat/topics:
    get:
      tags: [学生端]
      summary: 获取对话话题卡片
      description: 返回推荐的话题卡片列表，用于引导学生开启对话
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      topics:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            icon:
                              type: string

  /api/v1/risk/detect:
    post:
      tags: [学生端]
      summary: 风险检测
      description: 对用户内容进行风险等级检测，返回风险等级、置信度和触发的关键词
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, content]
              properties:
                userId:
                  type: string
                  description: 用户ID
                content:
                  type: string
                  description: 待检测内容
                  maxLength: 5000
                contentType:
                  type: string
                  description: 内容类型
      responses:
        '200':
          description: 检测成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      risk_level:
                        type: string
                        enum: [green, yellow, orange, red]
                      confidence:
                        type: number
                      triggered_keywords:
                        type: array
                        items:
                          type: string
                      need_intervention:
                        type: boolean

  /api/v1/risk/level/{userId}:
    get:
      tags: [学生端, 教师端]
      summary: 获取用户风险等级
      description: 查询用户当前风险等级及历史记录
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      current_risk_level:
                        type: string
                        enum: [green, yellow, orange, red]
                      history:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            level:
                              type: string

  /api/v1/risk/crisis/hotlines:
    get:
      tags: [学生端]
      summary: 获取危机干预热线
      description: 返回青少年心理危机干预热线列表
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      hotlines:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            number:
                              type: string
                            description:
                              type: string
                            hours:
                              type: string

  /api/v1/risk/crisis/report:
    post:
      tags: [学生端]
      summary: 上报危机事件
      description: 上报用户危机事件，触发干预流程
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, riskLevel]
              properties:
                userId:
                  type: string
                riskLevel:
                  type: string
                  enum: [green, yellow, orange, red]
                triggerType:
                  type: string
      responses:
        '200':
          description: 上报成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      risk_level:
                        type: string
                      handled:
                        type: boolean

  /api/v1/assessment/questions/{type}:
    get:
      tags: [学生端]
      summary: 获取测评题目
      description: 根据测评类型返回题目列表
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: 测评类型
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        question:
                          type: string
                        options:
                          type: array
                          items:
                            type: string
                        weight:
                          type: integer
                  total_questions:
                    type: integer

  /api/v1/assessment/submit:
    post:
      tags: [学生端]
      summary: 提交测评
      description: 提交测评答案并生成结果
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, answers]
              properties:
                userId:
                  type: string
                type:
                  type: string
                answers:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user_id:
                    type: string
                  total_score:
                    type: integer
                  result_id:
                    type: string

  /api/v1/assessment/result/{id}:
    get:
      tags: [学生端]
      summary: 获取测评结果
      description: 根据结果ID获取测评结果详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  result_id:
                    type: string
                  total_score:
                    type: integer
                  risk_level:
                    type: string
                    enum: [green, yellow, orange, red]
                  description:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: string
                  recommendations:
                    type: array
                    items:
                      type: object

  /api/v1/content/meditations:
    get:
      tags: [学生端, 教师端]
      summary: 获取冥想内容列表
      description: 返回冥想音频内容列表，可按分类筛选
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            default: all
          description: 分类（all/学习/睡眠/情绪）
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      category:
                        type: string
                      meditations:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            duration:
                              type: integer
                            category:
                              type: string
                            audio_url:
                              type: string
                            description:
                              type: string

  /api/v1/content/meditation/{id}:
    get:
      tags: [学生端, 教师端]
      summary: 获取冥想内容详情
      description: 根据ID返回冥想内容详情（含脚本、背景图等）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      duration:
                        type: integer
                      audio_url:
                        type: string
                      background_image:
                        type: string
                      script:
                        type: string

  /api/v1/content/breathing/{type}:
    get:
      tags: [学生端, 教师端]
      summary: 获取呼吸练习
      description: 根据类型返回呼吸练习步骤（如 4-7-8 呼吸法）
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: 呼吸练习类型
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                      steps:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            duration:
                              type: integer
                            instruction:
                              type: string
                      recommended_duration:
                        type: integer
                      animation_url:
                        type: string

  /api/v1/notifications/{userId}:
    get:
      tags: [学生端]
      summary: 获取通知列表
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==================== 教师端 ====================
  /api/v1/classroom/{classId}/stats:
    get:
      tags: [教师端]
      summary: 获取班级统计数据
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      statistics:
                        type: object
                      chartData:
                        type: object

  /api/v1/classroom/{classId}/students:
    get:
      tags: [教师端]
      summary: 获取班级学生列表
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      students:
                        type: array
                        items:
                          $ref: '#/components/schemas/StudentInfo'
                      alerts:
                        type: array

  /api/v1/chat/teacher/message:
    post:
      tags: [教师端]
      summary: 教师发送专业AI对话消息
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, message]
              properties:
                userId:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: 对话成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/data/import:
    post:
      tags: [教师端]
      summary: 导入数据
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  description: 导入类型 (excel/csv)
      responses:
        '200':
          description: 导入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                      count:
                        type: integer

  /api/v1/data/export/{type}:
    get:
      tags: [教师端]
      summary: 导出数据
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
