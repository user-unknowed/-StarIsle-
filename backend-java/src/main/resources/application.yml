server:
  port: ${SERVER_PORT:8081}
  # 错误响应不暴露堆栈与内部信息
  error:
    include-stacktrace: never
    include-message: never
  # 仅在可信反向代理之后开启，用于正确解析客户端 IP
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: starisle-backend

  # Database configuration - 统一使用 PostgreSQL (生产/测试)，H2 仅用于本地开发
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:starisle;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: ${FORMAT_SQL:false}
        jdbc:
          lob:
            non_contextual_creation: true

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema-postgresql.sql

  data:
    mongodb:
      uri: ${MONGODB_URL:mongodb://localhost:27017/starisle}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 开发环境可保留排除项；生产环境通过 ENVIRONMENT=production 时由配置类控制
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

starisle:
  jwt:
    secret: ${JWT_SECRET:starisle-jwt-secret-key-2026-very-secure}
    expiration: 86400000

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    # 与 ai-engine 的 INTERNAL_API_KEY 保持一致，防止绕过网关直连
    token: ${AI_INTERNAL_TOKEN:}

  encryption:
    key: ${ENCRYPTION_KEY:starisle2026securekey32byteslong}
    master-key: ${ENCRYPTION_MASTER_KEY:starmaster2026securekey32byteslo}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rps: ${RATE_LIMIT_RPS:100}
    burst: ${RATE_LIMIT_BURST:0}
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}

  # CORS 白名单：生产环境必须显式配置可信来源，禁止使用 *
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  # 个人数据同意策略
  consent:
    policy-version: ${CONSENT_POLICY_VERSION:2026-11-21}
    default-ttl-days: ${CONSENT_DEFAULT_TTL_DAYS:180}
    max-ttl-days: ${CONSENT_MAX_TTL_DAYS:365}

  # 内部管理令牌：为空时 /api/migration、/actuator、/h2-console 一律拒绝
  admin-token: ${ADMIN_API_TOKEN:}
  # 是否启用管理端点，默认关闭；公网部署必须保持 false
  admin-enabled: ${ADMIN_ENABLED:false}

  migration:
    source-url: ${MIGRATION_SOURCE_URL:jdbc:h2:mem:starisle;DB_CLOSE_DELAY=-1}
    source-username: ${MIGRATION_SOURCE_USERNAME:sa}
    source-password: ${MIGRATION_SOURCE_PASSWORD:}
    source-driver: ${MIGRATION_SOURCE_DRIVER:org.h2.Driver}

logging:
  level:
    com.starisle: ${LOG_LEVEL:INFO}
    org.springframework: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}
