# 星屿公网入口配置（唯一对外入口）
# 仅暴露 nginx 的 80/443；网关、ai-engine 与数据库都不映射公网端口。
# 部署时需挂载真实证书到 /etc/nginx/ssl/ 并把 server_name 改为实际域名。

# 应用层限流（网关内部还有一层按 IP+用户的令牌桶）
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=20r/s;

upstream api_gateway {
    server backend-java:8080;
    keepalive 32;
}

# HTTP 一律跳转 HTTPS
server {
    listen 80;
    server_name starisle.example.com;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name starisle.example.com;

    # 关闭版本号回显
    server_tokens off;

    # 证书：仅 TLS 1.2/1.3
    ssl_certificate /etc/nginx/ssl/starisle.crt;
    ssl_certificate_key /etc/nginx/ssl/starisle.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 10M;
    client_body_buffer_size 1M;

    # 明确阻断运维/管理端点，避免任何误配置把它们带到公网
    # 网关内部同样要求管理令牌且默认关闭，这里是第二道防线
    location = /actuator { return 404; }
    location ^~ /actuator/ { return 404; }
    location ^~ /h2-console { return 404; }
    location ^~ /api/migration { return 404; }
    location ^~ /api/v1/admin { return 404; }

    # 业务 API：仅代理 Java 网关
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 网关健康检查（供负载均衡/监控使用）
    location = /health {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://api_gateway/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # WebSocket 对话（JWT 在网关握手阶段校验）
    location /ws/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 前端静态资源；未挂载时返回 404，不影响 API
    location / {
        root /var/www/starisle;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    access_log /var/log/nginx/starisle_access.log;
    error_log /var/log/nginx/starisle_error.log;
}
